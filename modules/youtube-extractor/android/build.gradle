apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.youtubeextractor'
version = '1.0.0'

def getKotlinVersion() {
  if (rootProject.ext.has('kotlinVersion')) {
    return rootProject.ext.get('kotlinVersion')
  }
  return '1.9.24'
}

buildscript {
  def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '1.9.24'

  repositories {
    mavenCentral()
    google()
  }

  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }
}

android {
  compileSdkVersion project.hasProperty('compileSdkVersion') ? project.compileSdkVersion : 34

  defaultConfig {
    minSdkVersion project.hasProperty('minSdkVersion') ? project.minSdkVersion : 24
    targetSdkVersion project.hasProperty('targetSdkVersion') ? project.targetSdkVersion : 34
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles("proguard-rules.pro")
  }

  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  kotlinOptions {
    jvmTarget = '1.8'
  }
}

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getKotlinVersion()}"

  // Core library desugaring for NewPipeExtractor Java 8+ APIs on older Android devices
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

  // NewPipeExtractor & Networking
  implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
